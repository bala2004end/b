spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aidb_prod}?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:4}
      minimum-idle: ${DB_POOL_MIN:1}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      pool-name: AiDB-App-Pool
      leak-detection-threshold: 60000
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.format_sql: false
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true

logging:
  level:
    root: WARN
    com.aidb.assistant: INFO
    org.hibernate: WARN
  file:
    name: /var/log/aidb-assistant/app.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
