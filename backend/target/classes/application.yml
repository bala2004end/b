server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB

spring:
  application:
    name: aidb-assistant
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

aidb:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  encryption:
    key: ${ENCRYPTION_KEY}
  sql:
    read-only: true
    max-rows: ${SQL_MAX_ROWS:500}
  gemini:
    api-key: ${GEMINI_API_KEY}
    model-name: ${GEMINI_MODEL_NAME:gemini-1.5-flash}
    embedding-model-name: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId:-no-id}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.aidb.assistant: INFO
